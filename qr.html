<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CyberTravelling · QR</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tektur:wght@700&family=IBM+Plex+Mono:wght@600&display=swap" />
  <style>
    :root{--bg:#070A12;--line:#2A3552;--cy:#35E7FF;--tx:#FFFFFF;--mu:#B4C0D4}
    *{box-sizing:border-box;margin:0}
    body{min-height:100vh;background:var(--bg);color:var(--tx);display:grid;place-items:center;padding:72px 20px 24px;
      font-family:"IBM Plex Mono",Consolas,monospace}
    .back{position:fixed;top:16px;left:16px;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;
      border:1px solid var(--line);color:var(--tx);text-decoration:none;font-weight:600;font-size:14px;background:transparent}
    .back:hover,.back:focus-visible{border-color:var(--cy);color:var(--cy);outline:none}
    main{display:grid;justify-items:center;gap:18px;text-align:center}
    h1{font:700 clamp(28px,6vw,44px) "Tektur",sans-serif}
    h1 b{color:var(--cy)}
    .qr{width:min(78vw,62vh,420px);height:auto;background:#fff;border:4px solid var(--cy);display:block}
    p{color:var(--mu);font-size:14px;word-break:break-all}
  </style>
</head>
<body>
  <a class="back" href="index.html" onclick="if(document.referrer.startsWith(location.origin)&&history.length>1){history.back();return false}">&larr; Back</a>
  <main>
    <h1>Cyber<b>Travelling</b></h1>
    <img class="qr" src="assets/media/qr.svg" alt="QR code: dzinkkj.github.io/cybertravelling">
    <p>dzinkkj.github.io/cybertravelling</p>
  </main>
</body>
</html>
